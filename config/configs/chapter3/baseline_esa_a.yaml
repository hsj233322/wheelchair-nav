# 第 3 章基线 2：能耗加权 A*（复现小论文里的 ESA*）
#
# 与 baseline_length_a 的差别只有一处：collect_pareto = true。
# 打开后 core/astar.py 会把搜索跑完，返回终点处完整的 (长度, 能耗) 非支配集；
# 分析层在前沿上取**能耗最小点**，并用"把 e_budget 压到该点的紧约束"重跑一次，
# 得到那条路径本身（路径、离障、逐段能耗都需要，前沿只给数值对）。
#
# 口径说明（必须写进论文）：
#   * 小论文的 ESA* 用 g=能耗、h=欧氏距离（米），量纲不一致、启发式失效；
#     本框架按**精确**能耗最优复现（前沿 + 紧能耗预算），不沿用那个错位。
#   * 小论文在 0.7 m 膨胀图上跑所有方法；本框架把"物理半径(0.58)"给基线、
#     "策略半径(0.70)"作为本文硬约束，两者的差就是表中"不可行任务数"。
id: ch3_baseline_esa

astar:
  e_budget: 2000.0
  d_min: 0.58             # 物理外接圆半径（同基线 1）
  kappa_max: 1.5
  kappa_window_m: 0.6
  v_cruise: 1.0
  max_labels_per_state: 64
  max_expansions: 2000000
  collect_pareto: true    # 收集 (长度, 能耗) 前沿，供分析层取能耗最小点
