# 第 1 层：平台参数（platform）
# 只描述轮椅这台机器本身。实验里**不允许**改这一层；改它等于换了一台机器。
# 参数来源与敏感性分析见第 2 章；这里只给冻结值。
mass: 100.0            # 人 + 车总质量 [kg]
g: 9.81               # 重力加速度 [m/s^2]
body_radius: 0.58     # 等效车身半径 [m]
inflation: 0.12       # 安全膨胀量 [m]，env 层栅格化时使用（当前由 astar.d_min 统一约束）
v_max: 1.0            # 最大线速度 [m/s]
w_max: 2.09           # 最大角速度 [rad/s]
a_max: 0.8            # 最大线加速度 [m/s^2]
alpha_max: 2.09       # 最大角加速度 [rad/s^2]
eta: 0.85             # 传动效率 [-]
p_aux: 15.0           # 辅助负载功率（控制器/传感器/照明）[W]
battery_voltage: 24.0 # 电池标称电压 [V]
battery_resistance: 0.08  # 电池等效内阻 [Ohm]
