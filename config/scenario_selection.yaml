# 场景选取：从 data/houseexpo 的 260 个候选里挑出要固化的户型。
#
# 依据 docs/floorplan_screening.csv（`python -m env.screen_floorplans` 生成）。
#
# 难度分档（2026-10-25 第二次修正）**只由 bottleneck_width_m 决定**——起终点之间
# 最宽瓶颈的宽度，与 A* 走哪条路、与 algo.astar.d_min 都无关，因此同一场景在任何
# d_min 档位下档位标签一致：
#
#   hard   : bottleneck < 1.6 m   （1.40 m 基准要求 + 0.2 m 余量，两格）
#   medium : 1.6 <= bottleneck < 2.0 m
#   easy   : bottleneck >= 2.0 m  （余量 >= 0.6 m，通道基本不构成约束）
#
# 参考量：2 x body_radius = 1.16 m（物理最小）、2 x base d_min(0.70) = 1.40 m（策略最小）。
# 采样规则：easy 在同一房间内采样、路径 >= 4 m；medium/hard 在不同房间之间采样、
# 路径 >= 8 m；全部用 core.astar 在基准 d_min 下验证有解，不达标就跳过。
# 生成器会把候选按"区域级瓶颈宽度落在目标档"排序后再采样，最终以起终点算出的
# bottleneck_width_m 为准；因此每个档位多备几个候选，跳过的会打印 SKIP。
version: 2
min_path_len_m: 8.0
easy_min_path_len_m: 4.0
note: "分档只看 bottleneck_width_m；改这里要重跑 env/build_scenarios.py"
tiers:
  easy:                     # 开阔大空间：单房间、侵蚀后不分裂
    - d398cc42034810e0bef66fe9c27e282e   # 1 房间, 33726 格, unreachable 0
    - 0d78ffe6f03f4fd09a1cec72760ac92c   # 1 房间, 32889 格
