# 第 2 层：场景参数（scenario）
# 地图、路面材质、坡度分布。实验里**不允许**改这一层；换它就等于换了一个场景。
#
# 坐标约定：世界坐标单位 m，栅格第 0 行对应 y 最小的一侧，第 0 列对应 x 最小的一侧。
# 墙体用轴对齐矩形 [x0, y0, x1, y1] 描述；只要某个栅格单元与矩形有重叠，该单元即视为障碍
# （保守栅格化，薄墙不会漏掉）。
#
# 说明：这是接入 HouseExpo 之前的占位场景（12 m x 8 m），用于把平台链路跑通；
# 真实平面图接入 env/floorplan.py 后，本文件由平面图转换脚本生成，不再手写。
id: house_01
description: 单间 + 隔墙门洞 + 右上房间 + 4 度坡道；用于冒烟与链路验证的占位场景。

map:
  resolution: 0.2          # 栅格边长 [m]
  shape: [40, 60]          # [行数, 列数] = 8 m x 12 m
  origin: [0.0, 0.0]
  walls:
    - [0.0, 0.0, 12.0, 0.2]      # 下外墙
    - [0.0, 7.8, 12.0, 8.0]      # 上外墙
    - [0.0, 0.0, 0.2, 8.0]       # 左外墙
    - [11.8, 0.0, 12.0, 8.0]     # 右外墙
    - [5.8, 0.2, 6.0, 3.0]       # 隔墙下段，门洞 y ∈ [3.0, 5.0]，净宽 2.0 m
    - [5.8, 5.0, 6.0, 7.8]       # 隔墙上段
    - [6.0, 4.8, 9.0, 5.0]       # 右上房间隔墙，开口 x ∈ [9.0, 11.8]
    - [2.0, 3.5, 2.6, 4.5]       # 独立柱，用于强制绕行

start: [1.2, 1.2]    # 起点（车身中心，世界坐标）
goal: [10.8, 6.8]    # 终点（车身中心，世界坐标）

# 路面与坡度：先取 default，再按 patches 顺序覆盖（后面的覆盖前面的）。
# slope_deg 是沿 +x 方向的有符号坡度：正值表示地面向 +x 抬高。
terrain:
  default:
    c_rr: 0.015        # 瓷砖地面滚动阻力系数
    slope_deg: 0.0
  patches:
    - id: carpet
      rect: [6.2, 5.2, 9.0, 7.6]
      c_rr: 0.030      # 地毯
      slope_deg: 0.0
    - id: ramp
      rect: [9.2, 5.2, 11.8, 7.6]
      c_rr: 0.015
      slope_deg: 4.0   # 4 度坡道（+x 上坡）
